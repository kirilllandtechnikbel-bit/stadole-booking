<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стадолье — бронирование</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ══════════ ФИРМЕННЫЙ СТИЛЬ СТАДОЛЬЕ ══════════ */
  :root{
    --green:#222B23; --cream:#F5EFE4; --sand:#E8DCC8; --terra:#C67B5C;
    --line:#d8ccb4;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Manrope',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--cream);color:var(--green);
    font-family:var(--sans);font-size:16px;line-height:1.4;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
  .logo{display:block;margin:0 auto 8px;width:110px;height:110px;border-radius:50%;box-shadow:0 4px 14px rgba(34,43,35,.18)}
  h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.3px;margin:4px 0 2px}
  .sub{color:#5c6a5c;font-size:14px;margin-bottom:18px}
  .card{background:#fff9ef;border:1px solid var(--sand);border-radius:16px;padding:14px 14px 16px;margin-bottom:14px}
  .label{font-size:13px;color:#5c6a5c;margin-bottom:6px;font-weight:500}

  /* ── Календарь ── */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-nav button{background:var(--sand);border:none;border-radius:10px;width:38px;height:38px;
    font-size:20px;color:var(--green);font-family:var(--sans)}
  .cal-nav .m{font-family:var(--serif);font-size:22px;font-weight:600}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow div{text-align:center;font-size:11px;color:#8a978a;padding:4px 0}
  .day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;background:transparent;user-select:none}
  .day.empty{visibility:hidden}
  .day.past,.day.busy{color:#c3bcae;cursor:default}
  .day.busy{background:repeating-linear-gradient(45deg,#efe6d5,#efe6d5 4px,#e6dbc4 4px,#e6dbc4 8px);
    text-decoration:line-through;text-decoration-thickness:1px}
  .day.free:active{background:var(--sand)}
  .day.start,.day.end{background:var(--terra);color:#fff;font-weight:600}
  .day.range{background:#eaddc9}
  .legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:#5c6a5c;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:12px;height:12px;border-radius:4px;display:inline-block}
  .dot.free{border:1px solid var(--sand);background:#fff9ef}
  .dot.sel{background:var(--terra)}
  .dot.bz{background:repeating-linear-gradient(45deg,#efe6d5,#efe6d5 3px,#e6dbc4 3px,#e6dbc4 6px)}

  /* ── Поля ── */
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  input,select{width:100%;font-family:var(--sans);font-size:16px;color:var(--green);
    background:#fff;border:1px solid var(--sand);border-radius:12px;padding:12px 12px;margin-bottom:10px}
  input:focus,select:focus{outline:none;border-color:var(--terra)}
  .check{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border:1px solid var(--sand);
    border-radius:12px;margin-bottom:10px;cursor:pointer}
  .check input{width:20px;height:20px;margin:0;accent-color:var(--terra)}
  .check .cl{flex:1}
  .check .price{color:var(--terra);font-weight:600}

  .summary{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
  .summary .dates{font-family:var(--serif);font-size:20px;font-weight:600}
  .summary .total{font-size:20px;font-weight:600;color:var(--terra)}
  .hint{font-size:12px;color:#8a978a;margin-top:4px}

  .btn{width:100%;background:var(--terra);color:#fff;border:none;border-radius:14px;
    padding:16px;font-family:var(--sans);font-size:17px;font-weight:600;margin-top:4px}
  .btn:disabled{background:#d9c4b6;color:#fff}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green);color:var(--cream);
    padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}
  .toast.show{opacity:1}
  .done{text-align:center;padding:30px 10px}
  .done .big{font-size:52px}
  .done h2{font-family:var(--serif);font-size:26px;margin:10px 0 6px}
  .hidden{display:none}
</style>
</head>

8oOJFH95M+4WsD+nFOikeORJoZGSRCGSSNsFT2II6H3rd/t221LC+JLA3snfULZhFd/8CONsv/Axn/aqdRGBRW+PDovvm8Panb6r3+yt/o90Pby2OH/4AzVi3VvcWdw1teW8ttOnDRTIUcfUHmncViKiiigAooooAKKKKACiiigAop0aPLKsMSNJK5wqICzMfYDk1ur4ZurZRLr13b6FEedl0S1ww/2YFy//AH1tHvRcLGASAMngVt2eguLWPUNauP7I0+QZjeRN01wP+mUXBb/eOF96kGraXpZxoOnGW4A41DUlWSRT6xxDKJ7E7z7isa8urm9upLu9uJbm4lOXmmcu7fUmgehqX+tJ9jk0vRrU6bpsmBMC+6e6x3mfjI/2Fwo9CeawbieK3j8yVtq9vU/Sqd9qkMGUixLJ7fdH41gXE8txJ5krlj+g+lNIdm9yxqF/Jdtj7kQPCf1NUqKKosKKKKACiiigAooooAKKKKACiiigAooooAtWl9cWvCPlP7jcitq11a2mwJP3Lf7XT865uiiwmrnZ/K6gjDKeh6itu18TazBAtrLcrqFoowLbUIluYwPYOCV/4CRXm8FxPAcxSsnsDx+VaEOtTLxNEsg9RwalomzWx3n9oeG7v/j98PS2TnrJpd2VXPr5coYfkwpP7P8ADU/Nt4lmtSf4NQ09hj/gURcfpXJRavZv94vGf9oZ/lVqO7tZPuXEZ/4FilYXqdH/AMI6H5tvEWgTg9M3piP5SKtL/wAIpq7f6uTTJR3Meq2xA/8AIlYIIPQg/Q0bQeq/pRqGhvf8InrA5dtNjX+8+qWwA/8AIlH/AAjbp/x869oFv6htQWQj8Iw1YOwf3R+VB464FGoaG9/Znh6Hm68Uib1SwsJJD/31JsFH2zwta822i3uouP4tRuxGn/fEQB/8frnJLm3j+/PGv/AhVWXVrNOjtIf9lf8AGiweh1kninVxE0Fg0GjwNwY9MhFuSPdx87fixrDPLM7HJJyzE8k+pNYU2tueIYQvuxyazri7uLj/AFsrMP7vQflTsOze50F1qdrBkBvNf+6n+NYt5qVxc5XPlx/3V/rVKinYpIKKKKYwooooAKKKKACiiigD/9k=" alt="Стадолье глэмпинг">
  <div class="sub">Одна палатка на всю территорию. Выберите даты — заявку подтвердит хозяин.</div>

  <div class="card">
    <div class="cal-nav">
      <button id="prev" aria-label="назад">‹</button>
      <div class="m" id="month"></div>
      <button id="next" aria-label="вперёд">›</button>
    </div>
    <div class="dow"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot free"></i> свободно</span>
      <span><i class="dot sel"></i> ваш выбор</span>
      <span><i class="dot bz"></i> занято</span>
    </div>
  </div>

  <div class="card">
    <div class="summary">
      <div class="dates" id="sumDates">Выберите даты</div>
      <div class="total" id="sumTotal"></div>
    </div>
    <div class="hint" id="sumHint">Первое нажатие — заезд, второе — выезд.</div>
  </div>

  <div class="card">
    <div class="label">Ваши данные</div>
    <input id="name" type="text" placeholder="Имя" autocomplete="name">
    <input id="phone" type="tel" placeholder="Телефон, напр. +375 29 …" autocomplete="tel" inputmode="tel">
    <div class="row">
      <select id="guests" aria-label="гостей">
        <option value="2">2 гостя</option>
        <option value="1">1 гость</option>
        <option value="3">3 гостя</option>
      </select>
    </div>
    <label class="check">
      <input id="fishing" type="checkbox">
      <span class="cl">Рыбалка — своё место у воды, шезлонги, навес</span>
      <span class="price">+30 BYN</span>
    </label>
    <input id="comment" type="text" placeholder="Комментарий (необязательно)">
  </div>

  <button class="btn" id="send" disabled>Отправить заявку</button>
</div>

<div id="doneScreen" class="done hidden">
  <div class="big">🏕️</div>
  <h2>Заявка принята!</h2>
  <p id="doneText">Хозяин свяжется с вами для подтверждения. Спасибо!</p>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════ Telegram Mini App / обычный сайт ══════════
var tg = window.Telegram && window.Telegram.WebApp;
// Скрипт telegram-web-app.js создаёт window.Telegram даже в обычном браузере,
// поэтому «настоящий» Telegram отличаем по непустому initData. На сайте (Tilda)
// inTG = false → показываем обычную кнопку на странице.
var inTG = !!(tg && tg.initData && tg.initData.length > 0);
if (inTG) { tg.ready(); tg.expand();
  // Внутри Telegram есть своя нижняя кнопка (MainButton) — прячем дублирующую на странице.
  document.getElementById('send').style.display='none';
}
// Подставим имя из профиля Telegram, если есть.
try { if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
  document.getElementById('name').value = tg.initDataUnsafe.user.first_name || '';
}} catch(e){}

// ══════════ Хелперы дат ══════════
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseIso(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function todayIso(){ var t=new Date(); return iso(t); }
var MONTH_NAMES=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

// ══════════ Состояние ══════════
var occupied = {};           // множество занятых НОЧЕЙ 'YYYY-MM-DD'
var ci=null, co=null;        // выбранные заезд/выезд (iso)
var view = new Date(); view.setDate(1);
var minMonth = new Date(); minMonth.setDate(1);
var maxMonth = new Date(); maxMonth.setDate(1); maxMonth.setMonth(maxMonth.getMonth()+MONTHS_AHEAD);

// ══════════ Занятые даты с сервера ══════════
function loadBusy(){
  fetch(API_URL+'?action=availability&token='+encodeURIComponent(API_TOKEN))
    .then(function(r){return r.json();})
    .then(function(res){
      if(!res || !res.ok) return;
      (res.busy||[]).forEach(function(b){
        // ночи от from до to-1 включительно (to — день выезда, свободен)
        for(var d=parseIso(b.from); iso(d)<b.to; d=addDays(d,1)) occupied[iso(d)]=true;
      });
      render();
    })
    .catch(function(){ /* нет сети — покажем календарь без занятых, сервер всё равно проверит */ });
}

// ══════════ Логика выбора ══════════
function nightOccupied(dIso){ return !!occupied[dIso]; }
function rangeClear(a,b){ // нет занятых ночей в [a,b)
  for(var d=parseIso(a); iso(d)<b; d=addDays(d,1)) if(nightOccupied(iso(d))) return false;
  return true;
}
function onDay(dIso){
  var t=todayIso();
  if(dIso<t) return;
  if(!ci || (ci && co)){                       // начинаем новый выбор
    if(nightOccupied(dIso)) return;            // заезд нельзя в занятую ночь
    ci=dIso; co=null;
  } else if(dIso<=ci){                          // выбрали дату <= заезда → это новый заезд
    if(nightOccupied(dIso)) return;
    ci=dIso; co=null;
  } else {                                      // выбираем выезд
    if(!rangeClear(ci,dIso)){ toast('В этом промежутке есть занятые даты'); return; }
    co=dIso;
  }
  render(); updateSummary();
}

// ══════════ Рендер календаря ══════════
function render(){
  document.getElementById('month').textContent = MONTH_NAMES[view.getMonth()]+' '+view.getFullYear();
  document.getElementById('prev').style.visibility = (view<=minMonth)?'hidden':'visible';
  document.getElementById('next').style.visibility = (view>=maxMonth)?'hidden':'visible';
  var grid=document.getElementById('grid'); grid.innerHTML='';
  var first=new Date(view.getFullYear(),view.getMonth(),1);
  var lead=(first.getDay()+6)%7;               // Пн=0
  for(var i=0;i<lead;i++){ var e=document.createElement('div'); e.className='day empty'; grid.appendChild(e); }
  var t=todayIso();
  var dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  for(var day=1;day<=dim;day++){
    var d=new Date(view.getFullYear(),view.getMonth(),day), s=iso(d);
    var el=document.createElement('div'); el.className='day'; el.textContent=day;
    if(s<t){ el.classList.add('past'); }
    else if(nightOccupied(s)){ el.classList.add('busy'); }
    else { el.classList.add('free'); (function(x){ el.addEventListener('click',function(){onDay(x);}); })(s); }
    if(s===ci) el.classList.add('start');
    if(s===co) el.classList.add('end');
    if(ci&&co&&s>ci&&s<co) el.classList.add('range');
    grid.appendChild(el);
  }
}

document.getElementById('prev').onclick=function(){ if(view>minMonth){ view.setMonth(view.getMonth()-1); render(); } };
document.getElementById('next').onclick=function(){ if(view<maxMonth){ view.setMonth(view.getMonth()+1); render(); } };

// ══════════ Сводка и цена ══════════
function fmt(s){ var p=s.split('-'); return p[2]+'.'+p[1]; }
function estimate(){
  if(!ci||!co) return 0;
  var sum=0;
  for(var d=parseIso(ci); iso(d)<co; d=addDays(d,1)){
    var wd=d.getDay();                          // 0=вс … 5=пт 6=сб
    sum += (wd===5||wd===6)?PRICE_WEEKEND:PRICE_WEEKDAY;
  }
  if(document.getElementById('fishing').checked) sum+=PRICE_FISHING;
  return sum;
}
function nights(){ return ci&&co ? Math.round((parseIso(co)-parseIso(ci))/86400000) : 0; }
function updateSummary(){
  var sd=document.getElementById('sumDates'), st=document.getElementById('sumTotal'), sh=document.getElementById('sumHint');
  if(ci&&co){
    sd.textContent=fmt(ci)+' → '+fmt(co);
    var n=nights(); st.textContent='≈ '+estimate()+' BYN';
    sh.textContent=n+(n===1?' ночь':(n<5?' ночи':' ночей'))+'. Точную сумму подтвердит хозяин.';
  } else if(ci){
    sd.textContent=fmt(ci)+' → …'; st.textContent=''; sh.textContent='Теперь выберите дату выезда.';
  } else {
    sd.textContent='Выберите даты'; st.textContent=''; sh.textContent='Первое нажатие — заезд, второе — выезд.';
  }
  updateSendState();
}
document.getElementById('fishing').addEventListener('change',updateSummary);

// ══════════ Отправка ══════════
function valid(){
  return ci && co && document.getElementById('name').value.trim() && document.getElementById('phone').value.trim().length>=6;
}
function updateSendState(){
  var ok=valid();
  var btn=document.getElementById('send'); btn.disabled=!ok;
  if(inTG){ if(ok){ tg.MainButton.setText('Отправить заявку').show().enable(); } else { tg.MainButton.hide(); } }
}
['name','phone'].forEach(function(id){ document.getElementById(id).addEventListener('input',updateSendState); });

function send(){
  if(!valid()) return;
  var btn=document.getElementById('send'); btn.disabled=true; btn.textContent='Отправляем…';
  if(inTG){ tg.MainButton.showProgress(); }
  var body={
    token:API_TOKEN, action:'addBooking',
    checkin:ci, checkout:co,
    name:document.getElementById('name').value.trim(),
    phone:document.getElementById('phone').value.trim(),
    guests:document.getElementById('guests').value,
    tariff:tariffLabel(),
    fishing:document.getElementById('fishing').checked?'да':'нет',
    source: inTG ? 'telegram' : 'сайт',
    comment:document.getElementById('comment').value.trim(),
    // Telegram-id гостя — чтобы бот мог сам написать ему об итоге брони (только из Telegram)
    tg_user_id: (inTG && tg.initDataUnsafe && tg.initDataUnsafe.user) ? String(tg.initDataUnsafe.user.id) : ''
  };
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(res){
      if(inTG){ tg.MainButton.hideProgress(); }
      if(res && res.ok && res.free){ showDone(); }
      else if(res && res.ok && res.free===false){ occupiedReload(); toast('Увы, эти даты только что заняли. Выберите другие.'); resetBtn(); }
      else { toast('Не получилось отправить. Попробуйте ещё раз.'); resetBtn(); }
    })
    .catch(function(){ if(inTG){tg.MainButton.hideProgress();} toast('Нет связи. Проверьте интернет.'); resetBtn(); });
}
function tariffLabel(){
  // грубая метка для хозяина: по дню заезда
  if(!ci) return '';
  var wd=parseIso(ci).getDay(); return (wd===5||wd===6)?'выходные':'будни';
}
function resetBtn(){ var b=document.getElementById('send'); b.textContent='Отправить заявку'; b.disabled=!valid(); if(inTG){updateSendState();} }
function occupiedReload(){ occupied={}; ci=null; co=null; loadBusy(); updateSummary(); }
function showDone(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('doneScreen').classList.remove('hidden');
  document.getElementById('doneText').textContent='Даты '+fmt(ci)+' → '+fmt(co)+'. Хозяин свяжется для подтверждения. Спасибо!';
  if(inTG){ tg.MainButton.hide(); }
}
document.getElementById('send').addEventListener('click',send);
if(inTG){ tg.MainButton.onClick(send); }

// старт
render(); updateSummary(); loadBusy();
</script>
</body>
</html>
